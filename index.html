<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Room Alert">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Room Alert">
<title>Room Alert</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  html,body{height:100%;overscroll-behavior:none}
  body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #audioGate.hidden{display:none!important}

  /* ---- Calling bell ---- */
  .bell-wrap{position:relative;width:min(74vw,17rem);aspect-ratio:1;margin:1.5rem auto}
  .bell-wrap::before,.bell-wrap::after{content:"";position:absolute;inset:0;border-radius:9999px;border:4px solid rgba(99,102,241,.55);animation:sonar 2.6s ease-out infinite;pointer-events:none}
  .bell-wrap::after{animation-delay:1.3s}
  @keyframes sonar{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
  .bell{position:relative;width:100%;height:100%;border-radius:9999px;border:0;cursor:pointer;
    background:radial-gradient(circle at 32% 24%,#c7d2fe 0%,#818cf8 22%,#4338ca 58%,#1e1b4b 100%);
    box-shadow:inset 0 -14px 26px rgba(0,0,0,.4),inset 0 10px 18px rgba(255,255,255,.4),0 0 0 8px #e0e7ff,0 0 0 12px #a5b4fc,0 24px 44px rgba(49,46,129,.55),0 0 60px rgba(99,102,241,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .08s,box-shadow .08s}
  .bell:active,.bell.hit{transform:scale(.94);box-shadow:inset 0 -6px 14px rgba(0,0,0,.45),inset 0 4px 10px rgba(255,255,255,.3),0 0 0 8px #e0e7ff,0 0 0 12px #a5b4fc,0 8px 18px rgba(49,46,129,.5),0 0 90px rgba(129,140,248,.8)}
  .bell .icon{font-size:6.5rem;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transform-origin:50% 10%}
  .bell.hit .icon{animation:swing .7s ease-in-out}
  @keyframes swing{0%,100%{transform:rotate(0)}15%{transform:rotate(22deg)}35%{transform:rotate(-18deg)}55%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
  .bell .lbl{font-size:1.9rem;font-weight:900;letter-spacing:.02em;text-shadow:0 2px 4px rgba(0,0,0,.4)}

  .em{background:linear-gradient(#ef4444,#b91c1c);box-shadow:0 8px 0 #7f1d1d,0 14px 24px rgba(127,29,29,.45);border:4px solid #fecaca}
  .em:active{transform:translateY(6px);box-shadow:0 2px 0 #7f1d1d}

  /* ---- Son overlay ---- */
  @keyframes amberbg{0%,100%{background-color:#fbbf24}50%{background-color:#f59e0b}}
  @keyframes redbg{0%,100%{background-color:#dc2626}50%{background-color:#450a0a}}
  .amber{animation:amberbg 1.4s ease-in-out infinite}
  .red{animation:redbg .6s steps(1) infinite}
  .press{transition:transform .08s}
  .press:active{transform:scale(.97)}
  .reply{min-height:5.25rem;font-size:1.75rem;font-weight:800;border-radius:1.5rem;background:#fff;color:#0f172a;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.25);border:3px solid rgba(0,0,0,.15)}
  .reply:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  @media (prefers-reduced-motion:reduce){.bell-wrap::before,.bell-wrap::after{animation:none}}
</style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

<div id="app" class="min-h-full max-w-md mx-auto flex flex-col p-4 gap-3">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span id="dot" class="w-3.5 h-3.5 rounded-full bg-slate-400"></span>
      <span id="conn" class="text-base font-medium text-slate-700">Connecting…</span>
    </div>
    <button id="roleToggle" class="text-xs text-slate-400 underline"></button>
  </header>

  <div id="cfgWarn" class="hidden bg-yellow-100 border border-yellow-400 text-yellow-900 rounded-xl p-3 text-sm">
    Firebase not configured. Edit <code>firebaseConfig</code> in the script block.
  </div>

  <!-- Offline banner: alerts cannot arrive while this is visible -->
  <div id="netBar" role="alert" class="hidden bg-red-600 text-white rounded-xl px-4 py-3 text-lg font-bold text-center shadow"></div>

  <!-- Non-blocking nudge: only shows if browser still needs a tap for sound / notifications -->
  <button id="enableChip" class="hidden press w-full bg-indigo-600 text-white rounded-xl py-3 text-lg font-bold shadow"></button>

  <main id="view" class="flex-1 flex flex-col gap-3"></main>
</div>

<!-- One-time setup (first launch only) -->
<div id="audioGate" class="fixed inset-0 z-50 bg-indigo-800 text-white flex flex-col items-center justify-center gap-6 p-8 text-center">
  <div class="text-7xl">🔔</div>
  <h1 class="text-4xl font-black">Room Alert</h1>
  <p class="text-indigo-100 text-lg">One-time setup. Tap to allow sound and alerts. You won't be asked again.</p>
  <button id="audioBtn" class="press bg-white text-indigo-800 font-black text-2xl rounded-full px-12 py-6 shadow-2xl">Enable Sound</button>
</div>
<!-- Hide gate BEFORE first paint if already authorized on this device -->
<script>try{if(localStorage.getItem("soundAuthorized")==="true"||localStorage.getItem("roomAlert.soundEnabled.v1")==="1")document.getElementById("audioGate").classList.add("hidden")}catch(e){}</script>

<!-- Alert overlay (son) -->
<div id="alertOv" class="hidden fixed inset-0 z-40 flex-col items-center justify-center p-5 text-center overflow-y-auto">
  <div id="alertHead" class="text-4xl font-black mb-6 leading-tight"></div>
  <div id="alertBtns" class="flex flex-col gap-4 w-full max-w-md"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, goOffline, goOnline }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCIfxOM0jddgDJLGvv-q4bu6xlSOsKSvYo",
  authDomain: "room-alert-34cd1.firebaseapp.com",
  databaseURL: "https://room-alert-34cd1-default-rtdb.firebaseio.com",
  projectId: "room-alert-34cd1",
  storageBucket: "room-alert-34cd1.firebasestorage.app",
  messagingSenderId: "428340494096",
  appId: "1:428340494096:web:745549aeb9cf83a2c46f95"
};
/* ============================================== */

/* ---------- Constants & helpers (all declared first: no TDZ crashes) ---------- */
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const role = params.get("role") === "mother" ? "mother" : "son";
const RESPONSES = ["On my way!", "In washroom", "Coming in 5 mins", "Coming in 10 mins"];
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");
const LS_AUTH = "soundAuthorized", LS_OLD = "roomAlert.soundEnabled.v1";
const TONES = {
  idle:  "bg-white border-slate-500 text-slate-900",
  call:  "bg-amber-300 border-amber-600 text-amber-950",
  emerg: "bg-red-700 border-red-900 text-white",
  reply: "bg-green-700 border-green-900 text-white"
};
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const isAuthorized = () => lsGet(LS_AUTH) === "true" || lsGet(LS_OLD) === "1";
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const fmt = ts => ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
const gateOpen = () => !$("audioGate").classList.contains("hidden");
let lastState = null;

/* ---------- Icon: indigo tile + white/gold desk call-bell, drawn on canvas ---------- */
function drawIcon(size) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const g = cv.getContext("2d"), s = size / 512;
  g.scale(s, s);
  // rich indigo, full-bleed (maskable-safe)
  const bg = g.createLinearGradient(0, 0, 512, 512);
  bg.addColorStop(0, "#5b5bf0"); bg.addColorStop(0.55, "#3730a3"); bg.addColorStop(1, "#1e1b4b");
  g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
  const glow = g.createRadialGradient(256, 300, 20, 256, 300, 260);
  glow.addColorStop(0, "rgba(165,180,252,.45)"); glow.addColorStop(1, "rgba(165,180,252,0)");
  g.fillStyle = glow; g.fillRect(0, 0, 512, 512);
  // ring rays
  g.strokeStyle = "#fde68a"; g.lineWidth = 20; g.lineCap = "round";
  [-160, -125, -55, -20].forEach(d => {
    const a = d * Math.PI / 180;
    g.beginPath();
    g.moveTo(256 + 158 * Math.cos(a), 330 + 158 * Math.sin(a));
    g.lineTo(256 + 200 * Math.cos(a), 330 + 200 * Math.sin(a));
    g.stroke();
  });
  // dome
  const dome = g.createLinearGradient(0, 200, 0, 336);
  dome.addColorStop(0, "#ffffff"); dome.addColorStop(1, "#c7d2fe");
  g.fillStyle = dome;
  g.beginPath(); g.moveTo(130, 332); g.arc(256, 332, 126, Math.PI, 2 * Math.PI); g.closePath(); g.fill();
  // knob
  g.fillStyle = "#fbbf24";
  g.fillRect(244, 178, 24, 30);
  g.beginPath(); g.arc(256, 172, 24, 0, Math.PI * 2); g.fill();
  // base
  g.fillStyle = "#fbbf24";
  g.beginPath();
  if (g.roundRect) g.roundRect(94, 340, 324, 44, 22); else g.rect(94, 340, 324, 44);
  g.fill();
  // dome highlight
  g.strokeStyle = "rgba(79,70,229,.35)"; g.lineWidth = 14;
  g.beginPath(); g.arc(256, 332, 96, Math.PI * 1.08, Math.PI * 1.38); g.stroke();
  return cv.toDataURL("image/png");
}

/* ---------- PWA manifest (inline) + icons ---------- */
const ICON192 = drawIcon(192), ICON512 = drawIcon(512);
(() => {
  const base = location.href.split("?")[0].split("#")[0];
  const dir = base.slice(0, base.lastIndexOf("/") + 1);
  const m = {
    id: base + "?role=" + role,
    name: role === "mother" ? "Room Alert (Mom)" : "Room Alert (Son)",
    short_name: role === "mother" ? "Alert Mom" : "Alert Son",
    description: "Room intercom and alert system",
    start_url: base + "?role=" + role,
    scope: dir,
    display: "standalone",
    display_override: ["fullscreen", "standalone"],
    orientation: "portrait",
    background_color: "#312e81", theme_color: "#312e81",
    categories: ["lifestyle", "utilities"],
    icons: [
      { src: ICON192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: ICON512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: ICON512, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  const add = (rel, href, extra = {}) => {
    const l = document.createElement("link"); l.rel = rel; l.href = href;
    Object.entries(extra).forEach(([k, v]) => l.setAttribute(k, v));
    document.head.appendChild(l);
  };
  add("manifest", URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" })));
  add("icon", ICON192, { type: "image/png" });
  add("apple-touch-icon", ICON512);
})();

/* ---------- Service worker (sw.js beside index.html) ---------- */
const swReady = ("serviceWorker" in navigator)
  ? navigator.serviceWorker.register("sw.js")
      .then(r => { try { r.update(); } catch (e) {} return navigator.serviceWorker.ready; })
      .catch(() => null)
  : Promise.resolve(null);

/* ---------- Role toggle ---------- */
const other = role === "mother" ? "son" : "mother";
$("roleToggle").textContent = `Role: ${role} (switch to ${other})`;
$("roleToggle").onclick = () => { params.set("role", other); location.search = params.toString(); };

/* ---------- Audio engine ---------- */
let ctx = null, master = null, chimeTimer = null, sirenOsc = null, sirenGain = null, sirenTimer = null, sirenT = 0;
let keepOsc = null, buzzTimer = null, wakeLock = null;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = 1.0;
    master.connect(comp); comp.connect(ctx.destination);
    ctx.onstatechange = () => {
      if (ctx.state === "running") { startKeepAlive(); if (chimeTimer) chimeBurst(); }
      else armUnlock();
      updateChip();
    };
  }
  if (ctx.state !== "running") ctx.resume().catch(() => {});
  else startKeepAlive();
  return ctx;
}

/* Inaudible tone keeps the page flagged as "playing audio" so mobile browsers freeze/throttle it less in background. Best effort. */
function startKeepAlive() {
  if (keepOsc || !ctx || ctx.state !== "running") return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 40; g.gain.value = 0.0015;
    o.connect(g).connect(ctx.destination); o.start(); keepOsc = o;
  } catch (e) {}
}

function bellTone(freq, start, dur, vol) {
  [[1, 1, "sine"], [2, 0.38, "sine"], [3, 0.16, "triangle"]].forEach(([mult, amp, type]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq * mult;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol * amp, start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(master);
    o.start(start); o.stop(start + dur + 0.05);
  });
}
function chimeOnce(t) {
  const C = 523.25, E = 659.25, G = 783.99;
  bellTone(C, t,        0.9, 0.55);
  bellTone(E, t + 0.20, 0.9, 0.55);
  bellTone(G, t + 0.40, 0.9, 0.55);
  [C, E, G, C * 2].forEach(f => bellTone(f, t + 0.65, 1.5, 0.5));
}
function chimeBurst() {
  if (!ctx || ctx.state !== "running") return; // never queue while suspended (would blast on resume)
  const t = ctx.currentTime + 0.02;
  chimeOnce(t); chimeOnce(t + 1.6); chimeOnce(t + 3.2);
}
function startChime() {
  stopSiren();
  if (chimeTimer) return;
  ensureCtx(); chimeBurst();
  chimeTimer = setInterval(chimeBurst, 7500);
}
function stopChime() { clearInterval(chimeTimer); chimeTimer = null; }

/* Siren pitch steps are pre-scheduled on the audio clock, so background timer throttling can't slow it */
function scheduleSiren(steps) {
  for (let i = 0; i < steps; i++) sirenOsc.frequency.setValueAtTime(i % 2 ? 1200 : 800, sirenT + i * 0.4);
  sirenT += steps * 0.4;
}
function startSiren() {
  stopChime();
  if (sirenOsc) return;
  ensureCtx();
  sirenOsc = ctx.createOscillator(); sirenGain = ctx.createGain();
  sirenOsc.type = "square"; sirenGain.gain.value = 0.55;
  sirenOsc.connect(sirenGain).connect(master);
  sirenT = ctx.currentTime; scheduleSiren(300);          // 2 min ahead
  sirenOsc.start();
  sirenTimer = setInterval(() => { if (sirenOsc) scheduleSiren(150); }, 60000);
}
function stopSiren() {
  clearInterval(sirenTimer); sirenTimer = null;
  if (sirenOsc) { try { sirenOsc.stop(); } catch (e) {} sirenOsc.disconnect(); sirenOsc = null; }
}

/* Repeating aggressive vibration while an alert is active */
function startBuzz(pat, every) { stopBuzz(); vibrate(pat); buzzTimer = setInterval(() => vibrate(pat), every); }
function stopBuzz() { clearInterval(buzzTimer); buzzTimer = null; vibrate(0); }
function stopAllAudio() { stopChime(); stopSiren(); stopBuzz(); }

async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}

/* ---------- Persistent sound permission ---------- */
// Gate appears only until `soundAuthorized` is saved. Browsers still suspend AudioContext on each
// cold load, so the first tap anywhere silently resumes it; no overlay, no prompt.
const UNLOCK_EVENTS = ["pointerup", "touchend", "click", "keydown"];
function onGesture() {
  if (gateOpen()) return;
  ensureCtx();
  if (ctx.state === "running") UNLOCK_EVENTS.forEach(e => removeEventListener(e, onGesture, true));
}
function armUnlock() { UNLOCK_EVENTS.forEach(e => addEventListener(e, onGesture, true)); }

$("audioBtn").onclick = () => {
  lsSet(LS_AUTH, "true");
  ensureCtx(); bellTone(659.25, ctx.currentTime, 0.8, 0.4); // confirmation ding
  $("audioGate").classList.add("hidden");
  keepAwake();
  requestNotif();                                           // prompt needs this user gesture
  updateChip();
  if (lastState) render(lastState);
};

/* ---------- Notifications ---------- */
const notifSupported = () => "Notification" in window;
let fallbackNote = null;

async function requestNotif() {
  if (!notifSupported() || Notification.permission !== "default") return;
  try { await Notification.requestPermission(); } catch (e) {}
  updateChip();
}
async function notify(title, opts = {}) {
  if (!notifSupported() || Notification.permission !== "granted") return;
  const o = { icon: ICON192, badge: ICON192, lang: "en", silent: false, timestamp: Date.now(), data: { url: location.href }, ...opts };
  const reg = await swReady;
  try { if (reg) { await reg.showNotification(title, o); return; } } catch (e) {}
  try { // desktop fallback if sw.js is missing
    if (fallbackNote) fallbackNote.close();
    fallbackNote = new Notification(title, o);
    fallbackNote.onclick = () => { window.focus(); fallbackNote.close(); };
  } catch (e) {}
}
async function clearNotes() {
  try { if (fallbackNote) { fallbackNote.close(); fallbackNote = null; } } catch (e) {}
  try {
    const reg = await swReady;
    if (reg) (await reg.getNotifications({ tag: "room-alert" })).forEach(n => n.close());
  } catch (e) {}
}

/* ---------- Enable chip ---------- */
function updateChip() {
  const chip = $("enableChip");
  if (!chip) return;
  const open = gateOpen();
  const needSound = !open && (!ctx || ctx.state !== "running");
  const needNotif = !open && notifSupported() && Notification.permission === "default";
  chip.classList.toggle("hidden", !(needSound || needNotif));
  chip.textContent = needSound && needNotif ? "🔇 Tap to enable sound & alerts"
                   : needSound ? "🔇 Tap to enable sound" : "🔕 Tap to enable alerts";
}
$("enableChip").onclick = () => { ensureCtx(); requestNotif(); updateChip(); };

/* ---------- Firebase: connection handling ---------- */
let db, stateRef, connected = false, kickTimer = null;
const idle = () => ({ status: "idle", mother_timestamp: 0, son_response: "Idle", response_timestamp: 0 });

function setConn(ok, msg) {
  $("dot").className = "w-3.5 h-3.5 rounded-full " + (ok ? "bg-green-500" : "bg-red-500");
  $("conn").textContent = msg;
  const bar = $("netBar");
  if (ok) bar.classList.add("hidden");
  else if (configured) {
    bar.textContent = role === "son" ? "⚠ Offline. You will NOT get calls until reconnected." : "⚠ Offline. Calls will send when reconnected.";
    bar.classList.remove("hidden");
  }
}
// Firebase auto-reconnects with backoff; this nudges it so recovery after a signal drop or app resume is fast.
function kick() {
  clearTimeout(kickTimer);
  if (connected || !db) return;
  try { goOffline(); setTimeout(() => { try { goOnline(); } catch (e) {} }, 400); } catch (e) {}
  kickTimer = setTimeout(kick, 12000);
}
addEventListener("online",  () => { if (!connected) { setConn(false, "Reconnecting…"); kick(); } });
addEventListener("offline", () => setConn(false, "No internet"));

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  keepAwake();
  if (!gateOpen() && ctx && ctx.state !== "running") { ctx.resume().catch(() => {}); armUnlock(); }
  if (!connected) kick();
  updateChip();
});

function send(patch) {
  if (!stateRef) return Promise.reject(new Error("Firebase not configured"));
  return update(stateRef, patch);
}

/* ---------- Views ---------- */
function buildView() {
  const v = $("view");
  if (role === "mother") {
    v.innerHTML = `
      <div class="flex-1 flex flex-col justify-center">
        <div class="bell-wrap">
          <button id="callBtn" class="bell press" aria-label="Ring bell, call son">
            <span class="icon">🔔</span>
            <span class="lbl">Need You</span>
          </button>
        </div>
        <button id="emBtn" class="em press w-full py-6 rounded-3xl text-white text-3xl font-black tracking-wide">🚨 EMERGENCY</button>
      </div>
      <div id="statusCard" aria-live="assertive" class="rounded-3xl border-4 p-6 text-center min-h-[11rem] flex flex-col items-center justify-center gap-2 shadow-lg"></div>`;
    const press = (btn, status, pat) => btn.onclick = () => {
      vibrate(pat);
      btn.classList.remove("hit"); void btn.offsetWidth; btn.classList.add("hit");
      setTimeout(() => btn.classList.remove("hit"), 750);
      send({ status, mother_timestamp: Date.now(), son_response: "Idle", response_timestamp: 0 })
        .catch(e => setConn(false, "Send failed: " + (e.code || e.message)));
    };
    press($("callBtn"), "calling", 80);
    press($("emBtn"), "emergency", [200, 100, 200, 100, 200]);
    renderStatus(TONES.idle, "", "Son is available", "");
  } else {
    v.innerHTML = `
      <div id="sonCard" class="flex-1 flex flex-col items-center justify-center rounded-3xl bg-green-100 border-4 border-green-500 text-green-900 p-8 text-center">
        <div class="text-7xl mb-4">🌿</div>
        <div class="text-3xl font-black">Monitoring alerts…</div>
        <div class="text-xl mt-1">Everything is quiet.</div>
        <div id="sendState" class="mt-5 text-2xl font-extrabold"></div>
        <div id="lastSent" class="mt-2 text-base font-semibold text-green-800"></div>
      </div>`;
    const g = $("alertBtns");
    g.innerHTML = RESPONSES.map((r, i) => `<button data-i="${i}" class="reply press w-full px-4">${esc(r)}</button>`).join("");
    g.querySelectorAll("button").forEach(b => b.onclick = async () => {
      const text = RESPONSES[+b.dataset.i];
      stopAllAudio(); vibrate(50); clearNotes();
      const ss = $("sendState");
      ss.textContent = "⏳ Sending…";
      let done = false;
      const t = setTimeout(() => { if (!done) ss.textContent = "📡 Offline. Will send when back online."; }, 4000);
      try {
        // Single atomic write: clears alert + sets reply. Local listener fires instantly, so overlay closes at once.
        await send({ status: "idle", son_response: text, response_timestamp: Date.now() });
        done = true; clearTimeout(t);
        ss.textContent = `✓ Delivered: ${text}`;
      } catch (e) {
        done = true; clearTimeout(t);
        ss.textContent = "⚠ Not delivered: " + (e.code || e.message);
      }
    });
  }
}

function renderStatus(tone, small, big, time) {
  const c = $("statusCard");
  if (!c) return;
  c.className = "rounded-3xl border-4 p-6 text-center min-h-[11rem] flex flex-col items-center justify-center gap-2 shadow-lg " + tone;
  c.innerHTML = (small ? `<div class="text-3xl font-bold">${esc(small)}</div>` : "") +
    `<div class="text-4xl font-black leading-tight break-words max-w-full">${esc(big)}</div>` +
    (time ? `<div class="text-3xl font-extrabold">${esc(time)}</div>` : "");
}

let lastAlertKey = "", lastReplyKey = null; // null = first snapshot not processed yet

function render(s) {
  if (role === "mother") {
    if (s.status === "calling") renderStatus(TONES.call, "", "Calling… waiting for Son", "");
    else if (s.status === "emergency") renderStatus(TONES.emerg, "", "🚨 Emergency sent. Waiting for Son", "");
    else if (s.son_response && s.son_response !== "Idle") {
      renderStatus(TONES.reply, "Son responded:", s.son_response, fmt(s.response_timestamp));
      const key = String(s.response_timestamp);
      if (lastReplyKey !== null && key !== lastReplyKey) {   // genuinely new reply
        vibrate([100, 60, 100, 60, 300]);
        if (document.visibilityState === "hidden")
          notify("Son replied", { body: `${s.son_response} · ${fmt(s.response_timestamp)}`, tag: "room-reply", renotify: true, requireInteraction: true, vibrate: [200, 100, 200] });
      }
      lastReplyKey = key;
    } else renderStatus(TONES.idle, "", "Son is available", "");
    if (lastReplyKey === null) lastReplyKey = String(s.response_timestamp);
    return;
  }
  // Son
  const ov = $("alertOv"), head = $("alertHead");
  const last = $("lastSent");
  if (last) last.textContent = s.son_response !== "Idle" ? `Last reply: ${s.son_response} (${fmt(s.response_timestamp)})` : "";
  if (s.status === "idle") {
    ov.classList.add("hidden"); ov.classList.remove("flex", "amber", "red");
    stopAllAudio(); lastAlertKey = ""; clearNotes(); return;
  }
  const key = s.status + ":" + s.mother_timestamp;
  const fresh = key !== lastAlertKey;
  lastAlertKey = key;
  ov.classList.remove("hidden"); ov.classList.add("flex");
  if (fresh) ensureCtx();                                    // try to wake audio immediately
  if (s.status === "calling") {
    ov.classList.add("amber"); ov.classList.remove("red");
    head.className = "text-4xl font-black mb-6 leading-tight text-slate-900";
    head.textContent = "Mom needs you in her room!";
    if (!gateOpen()) startChime();
    if (fresh) {
      startBuzz([400, 150, 400, 150, 400], 3000);
      notify("🔔 Mom needs you", { body: "Tap to open and reply.", tag: "room-alert", renotify: true, requireInteraction: true, vibrate: [400, 150, 400, 150, 400] });
    }
  } else {
    ov.classList.add("red"); ov.classList.remove("amber");
    head.className = "text-4xl font-black mb-6 leading-tight text-white drop-shadow";
    head.textContent = "🚨 EMERGENCY ALERT FROM MOM!";
    if (!gateOpen()) startSiren();
    if (fresh) {
      startBuzz([700, 150, 700, 150, 700, 150, 700], 2500);
      notify("🚨 EMERGENCY from Mom", { body: "Open the app and respond now.", tag: "room-alert", renotify: true, requireInteraction: true, vibrate: [700, 150, 700, 150, 700, 150, 700] });
    }
  }
}

/* ---------- Init (last, after every declaration above) ---------- */
if (isAuthorized()) {
  if (lsGet(LS_AUTH) !== "true") lsSet(LS_AUTH, "true");     // migrate old key
  try { ensureCtx(); } catch (e) {}
  keepAwake();
}
armUnlock();
updateChip();

if (!configured) {
  $("cfgWarn").classList.remove("hidden");
  setConn(false, "Not configured");
  buildView();
} else {
  try {
    db = getDatabase(initializeApp(firebaseConfig));
    stateRef = ref(db, "room_alert");
    if (!navigator.onLine) setConn(false, "No internet");
    onValue(ref(db, ".info/connected"), s => {
      connected = !!s.val();
      if (connected) { clearTimeout(kickTimer); setConn(true, role === "mother" ? "Connected to Home Network" : "Connected"); }
      else { setConn(false, navigator.onLine ? "Reconnecting…" : "No internet"); clearTimeout(kickTimer); kickTimer = setTimeout(kick, 8000); }
    });
    get(stateRef).then(s => { if (!s.exists()) set(stateRef, idle()); }).catch(e => setConn(false, "DB error: " + e.code));
    buildView();
    onValue(stateRef, s => { lastState = { ...idle(), ...(s.val() || {}) }; render(lastState); },
      e => setConn(false, "DB error: " + e.code));
  } catch (e) {
    console.error(e);
    setConn(false, "Config error"); $("cfgWarn").classList.remove("hidden");
  }
}
</script>
</body>
</html>
