<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Room Alert</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  html,body{height:100%}
  body{-webkit-tap-highlight-color:transparent;user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  @keyframes amber{0%,100%{background:rgba(251,191,36,.35)}50%{background:rgba(245,158,11,.75)}}
  @keyframes red{0%,100%{background:rgba(220,38,38,.95)}50%{background:rgba(69,10,10,.95)}}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(99,102,241,.6)}100%{box-shadow:0 0 0 40px rgba(99,102,241,0)}}
  .amber{animation:amber 1.6s ease-in-out infinite}
  .red{animation:red .6s steps(1) infinite}
  .ring{animation:pulse-ring .7s ease-out}
  .press:active{transform:scale(.96)}
</style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

<div id="app" class="min-h-full max-w-md mx-auto flex flex-col p-4 gap-4">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span id="dot" class="w-3 h-3 rounded-full bg-slate-400"></span>
      <span id="conn" class="text-sm text-slate-600">Connecting…</span>
    </div>
    <button id="roleToggle" class="text-xs text-slate-400 underline"></button>
  </header>

  <div id="cfgWarn" class="hidden bg-yellow-100 border border-yellow-400 text-yellow-900 rounded-xl p-3 text-sm">
    Firebase not configured. Edit <code>firebaseConfig</code> in the script block.
  </div>

  <main id="view" class="flex-1 flex flex-col gap-4"></main>
</div>

<!-- Audio unlock overlay -->
<div id="audioGate" class="fixed inset-0 z-50 bg-indigo-700 text-white flex flex-col items-center justify-center gap-6 p-8 text-center">
  <div class="text-6xl">🔔</div>
  <h1 class="text-3xl font-bold">Room Alert</h1>
  <p class="text-indigo-100">Tap to enable sound and alerts.</p>
  <button id="audioBtn" class="press bg-white text-indigo-700 font-bold text-2xl rounded-full px-10 py-5 shadow-xl">Enable Sound</button>
</div>

<!-- Alert overlay (son) -->
<div id="alertOv" class="hidden fixed inset-0 z-40 flex-col items-center justify-center p-6 text-center">
  <div id="alertHead" class="text-4xl font-extrabold text-white drop-shadow mb-8"></div>
  <div id="alertBtns" class="grid grid-cols-2 gap-3 w-full max-w-md"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, onDisconnect }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCIfxOM0jddgDJLGvv-q4bu6xlSOsKSvYo",
  authDomain: "room-alert-34cd1.firebaseapp.com",
  databaseURL: "https://room-alert-34cd1-default-rtdb.firebaseio.com",
  projectId: "room-alert-34cd1",
  storageBucket: "room-alert-34cd1.firebasestorage.app",
  messagingSenderId: "428340494096",
  appId: "1:428340494096:web:745549aeb9cf83a2c46f95"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
/* ============================================== */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const role = params.get("role") === "mother" ? "mother" : "son";
const RESPONSES = ["On my way!", "In washroom", "Coming in 5 mins", "Coming in 10 mins"];
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

/* ---------- PWA manifest (inline) ---------- */
(() => {
  const icon = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#4f46e5"/><text x="256" y="340" font-size="280" text-anchor="middle">🔔</text></svg>');
  const m = { name: "Room Alert", short_name: "Room Alert", display: "standalone",
    background_color: "#4f46e5", theme_color: "#4f46e5", start_url: location.href,
    icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml" }] };
  const l = document.createElement("link");
  l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  document.head.appendChild(l);
})();

/* ---------- Role toggle ---------- */
const other = role === "mother" ? "son" : "mother";
$("roleToggle").textContent = `Role: ${role} (switch to ${other})`;
$("roleToggle").onclick = () => { params.set("role", other); location.search = params.toString(); };

/* ---------- Audio engine ---------- */
let ctx = null, chimeTimer = null, sirenOsc = null, sirenGain = null, sirenTimer = null, wakeLock = null;

function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
function tone(freq, start, dur, vol = 0.25) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g).connect(ctx.destination);
  o.start(start); o.stop(start + dur + 0.05);
}
function chime() {
  if (!ctx) return;
  const t = ctx.currentTime;
  tone(523.25, t, 0.6);
  tone(659.25, t + 0.35, 0.9);
}
function startChime() {
  stopSiren();
  if (chimeTimer) return;
  ensureCtx(); chime();
  chimeTimer = setInterval(chime, 3000);
}
function stopChime() { clearInterval(chimeTimer); chimeTimer = null; }
function startSiren() {
  stopChime();
  if (sirenOsc) return;
  ensureCtx();
  sirenOsc = ctx.createOscillator(); sirenGain = ctx.createGain();
  sirenOsc.type = "square"; sirenGain.gain.value = 0.3;
  sirenOsc.frequency.value = 800;
  sirenOsc.connect(sirenGain).connect(ctx.destination);
  sirenOsc.start();
  let hi = false;
  sirenTimer = setInterval(() => {
    hi = !hi;
    sirenOsc.frequency.setTargetAtTime(hi ? 1200 : 800, ctx.currentTime, 0.02);
  }, 400);
}
function stopSiren() {
  clearInterval(sirenTimer); sirenTimer = null;
  if (sirenOsc) { try { sirenOsc.stop(); } catch (e) {} sirenOsc.disconnect(); sirenOsc = null; }
}
function stopAllAudio() { stopChime(); stopSiren(); }

async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

$("audioBtn").onclick = () => {
  ensureCtx(); tone(523.25, ctx.currentTime, 0.3, 0.15); // confirmation blip
  $("audioGate").classList.add("hidden");
  keepAwake();
  if (lastState) render(lastState); // start alarms if already active
};

/* ---------- Helpers ---------- */
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const fmt = ts => ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
const gateOpen = () => !$("audioGate").classList.contains("hidden");

/* ---------- Firebase ---------- */
let db, stateRef, lastState = null;
const idle = () => ({ status: "idle", mother_timestamp: 0, son_response: "Idle", response_timestamp: 0 });

function setConn(ok, msg) {
  $("dot").className = "w-3 h-3 rounded-full " + (ok ? "bg-green-500" : "bg-red-500");
  $("conn").textContent = msg;
}

if (!configured) {
  $("cfgWarn").classList.remove("hidden");
  setConn(false, "Not configured");
  buildView();
} else {
  try {
    db = getDatabase(initializeApp(firebaseConfig));
    stateRef = ref(db, "room_alert");
    onValue(ref(db, ".info/connected"), s =>
      s.val() ? setConn(true, role === "mother" ? "Connected to Home Network" : "Connected") : setConn(false, "Reconnecting…"));
    get(stateRef).then(s => { if (!s.exists()) set(stateRef, idle()); }).catch(e => setConn(false, "DB error: " + e.code));
    buildView();
    onValue(stateRef, s => { lastState = { ...idle(), ...(s.val() || {}) }; render(lastState); },
      e => setConn(false, "DB error: " + e.code));
  } catch (e) {
    setConn(false, "Config error"); $("cfgWarn").classList.remove("hidden"); buildView();
  }
}

function send(patch) {
  if (!stateRef) { alert("Firebase not configured."); return; }
  update(stateRef, patch).catch(e => alert("Send failed: " + e.code));
}

/* ---------- Views ---------- */
function buildView() {
  const v = $("view");
  if (role === "mother") {
    v.innerHTML = `
      <div class="flex-1 flex flex-col justify-center gap-5">
        <button id="callBtn" class="press w-full aspect-square max-h-72 rounded-[3rem] bg-gradient-to-br from-indigo-400 to-indigo-600 text-white text-5xl font-extrabold shadow-2xl shadow-indigo-300">Need You</button>
        <button id="emBtn" class="press w-full py-6 rounded-3xl bg-red-600 text-white text-3xl font-extrabold shadow-xl">🚨 EMERGENCY</button>
      </div>
      <div id="statusCard" class="rounded-3xl bg-white border-2 border-slate-300 p-6 text-center text-2xl font-semibold leading-snug"></div>`;
    const press = (btn, status, pat) => btn.onclick = () => {
      vibrate(pat);
      btn.classList.remove("ring"); void btn.offsetWidth; btn.classList.add("ring");
      send({ status, mother_timestamp: Date.now(), son_response: "Idle", response_timestamp: 0 });
    };
    press($("callBtn"), "calling", 80);
    press($("emBtn"), "emergency", [200, 100, 200, 100, 200]);
  } else {
    v.innerHTML = `
      <div id="sonCard" class="flex-1 flex flex-col items-center justify-center rounded-3xl bg-green-100 border-2 border-green-400 text-green-900 p-8 text-center">
        <div class="text-6xl mb-4">🌿</div>
        <div class="text-2xl font-bold">Monitoring alerts…</div>
        <div class="text-lg">Everything is quiet.</div>
        <div id="lastSent" class="mt-4 text-sm text-green-700"></div>
      </div>`;
    const g = $("alertBtns");
    g.innerHTML = RESPONSES.map(r =>
      `<button data-r="${r}" class="press bg-white text-slate-900 font-bold text-xl rounded-2xl py-6 px-2 shadow-lg">${r}</button>`).join("");
    g.querySelectorAll("button").forEach(b => b.onclick = () => {
      vibrate(50); stopAllAudio();
      send({ status: "idle", son_response: b.dataset.r, response_timestamp: Date.now() });
    });
  }
}

function render(s) {
  if (role === "mother") {
    const c = $("statusCard");
    if (!c) return;
    if (s.status === "calling") { c.textContent = "Calling… waiting for Son"; c.className = c.className.replace(/bg-\S+|border-\S+/g, "") + " bg-amber-100 border-amber-400"; }
    else if (s.status === "emergency") { c.textContent = "🚨 Emergency sent. Waiting for Son"; c.className = c.className.replace(/bg-\S+|border-\S+/g, "") + " bg-red-100 border-red-500"; }
    else if (s.son_response && s.son_response !== "Idle") {
      c.textContent = `Son responded: ${s.son_response} (${fmt(s.response_timestamp)})`;
      c.className = c.className.replace(/bg-\S+|border-\S+/g, "") + " bg-green-100 border-green-500";
      if (c.dataset.seen !== String(s.response_timestamp)) { c.dataset.seen = s.response_timestamp; vibrate([100, 60, 100]); }
    } else {
      c.textContent = "Son is available";
      c.className = c.className.replace(/bg-\S+|border-\S+/g, "") + " bg-white border-slate-300";
    }
    return;
  }
  // Son
  const ov = $("alertOv"), head = $("alertHead");
  const last = $("lastSent");
  if (last) last.textContent = s.son_response !== "Idle" ? `Last reply: ${s.son_response} (${fmt(s.response_timestamp)})` : "";
  if (s.status === "idle") {
    ov.classList.add("hidden"); ov.classList.remove("flex", "amber", "red");
    stopAllAudio(); return;
  }
  ov.classList.remove("hidden"); ov.classList.add("flex");
  if (s.status === "calling") {
    ov.classList.add("amber"); ov.classList.remove("red");
    ov.style.backgroundColor = "";
    head.textContent = "Mom needs you in her room!";
    if (!gateOpen()) startChime();
    vibrate([300, 150, 300]);
  } else {
    ov.classList.add("red"); ov.classList.remove("amber");
    head.textContent = "🚨 EMERGENCY ALERT FROM MOM!";
    if (!gateOpen()) startSiren();
    vibrate([500, 200, 500, 200, 500]);
  }
}
</script>
</body>
</html>
