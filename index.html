<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Room Alert">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Room Alert</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  html,body{height:100%}
  body{-webkit-tap-highlight-color:transparent;user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  /* ---- Calling bell ---- */
  .bell-wrap{position:relative;width:min(74vw,17rem);aspect-ratio:1;margin:1.5rem auto}
  .bell-wrap::before,.bell-wrap::after{content:"";position:absolute;inset:0;border-radius:9999px;border:4px solid rgba(99,102,241,.55);animation:sonar 2.6s ease-out infinite;pointer-events:none}
  .bell-wrap::after{animation-delay:1.3s}
  @keyframes sonar{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
  .bell{position:relative;width:100%;height:100%;border-radius:9999px;border:0;cursor:pointer;
    background:radial-gradient(circle at 32% 24%,#c7d2fe 0%,#818cf8 22%,#4338ca 58%,#1e1b4b 100%);
    box-shadow:inset 0 -14px 26px rgba(0,0,0,.4),inset 0 10px 18px rgba(255,255,255,.4),0 0 0 8px #e0e7ff,0 0 0 12px #a5b4fc,0 24px 44px rgba(49,46,129,.55),0 0 60px rgba(99,102,241,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .08s,box-shadow .08s}
  .bell:active,.bell.hit{transform:scale(.94);box-shadow:inset 0 -6px 14px rgba(0,0,0,.45),inset 0 4px 10px rgba(255,255,255,.3),0 0 0 8px #e0e7ff,0 0 0 12px #a5b4fc,0 8px 18px rgba(49,46,129,.5),0 0 90px rgba(129,140,248,.8)}
  .bell .icon{font-size:6.5rem;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transform-origin:50% 10%}
  .bell.hit .icon{animation:swing .7s ease-in-out}
  @keyframes swing{0%,100%{transform:rotate(0)}15%{transform:rotate(22deg)}35%{transform:rotate(-18deg)}55%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
  .bell .lbl{font-size:1.9rem;font-weight:900;letter-spacing:.02em;text-shadow:0 2px 4px rgba(0,0,0,.4)}

  .em{background:linear-gradient(#ef4444,#b91c1c);box-shadow:0 8px 0 #7f1d1d,0 14px 24px rgba(127,29,29,.45);border:4px solid #fecaca}
  .em:active{transform:translateY(6px);box-shadow:0 2px 0 #7f1d1d}

  /* ---- Son overlay ---- */
  @keyframes amberbg{0%,100%{background-color:#fbbf24}50%{background-color:#f59e0b}}
  @keyframes redbg{0%,100%{background-color:#dc2626}50%{background-color:#450a0a}}
  .amber{animation:amberbg 1.4s ease-in-out infinite}
  .red{animation:redbg .6s steps(1) infinite}
  .press{transition:transform .08s}
  .press:active{transform:scale(.97)}
  .reply{min-height:5.25rem;font-size:1.75rem;font-weight:800;border-radius:1.5rem;background:#fff;color:#0f172a;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.25);border:3px solid rgba(0,0,0,.15)}
  .reply:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  @media (prefers-reduced-motion:reduce){.bell-wrap::before,.bell-wrap::after{animation:none}}
</style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

<div id="app" class="min-h-full max-w-md mx-auto flex flex-col p-4 gap-3">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span id="dot" class="w-3.5 h-3.5 rounded-full bg-slate-400"></span>
      <span id="conn" class="text-base font-medium text-slate-700">Connecting…</span>
    </div>
    <div class="flex items-center gap-3"><button id="soundMode" class="hidden"></button><button id="roleToggle" class="text-xs text-slate-400 underline"></button></div>
  </header>

  <div id="cfgWarn" class="hidden bg-yellow-100 border border-yellow-400 text-yellow-900 rounded-xl p-3 text-sm">
    Firebase not configured. Edit <code>firebaseConfig</code> in the script block.
  </div>

  <main id="view" class="flex-1 flex flex-col gap-3"></main>
</div>

<!-- Audio unlock overlay -->
<div id="audioGate" class="fixed inset-0 z-50 bg-indigo-800 text-white flex flex-col items-center justify-center gap-6 p-8 text-center">
  <div class="text-7xl">🔔</div>
  <h1 class="text-4xl font-black">Room Alert</h1>
  <p class="text-indigo-100 text-lg">Tap once to turn on sound and alerts.</p>
  <button id="audioBtn" class="press bg-white text-indigo-800 font-black text-2xl rounded-full px-12 py-6 shadow-2xl">Enable Sound</button>
</div>

<script>try{if(localStorage.getItem('soundEnabled')==='true')document.getElementById('audioGate').classList.add('hidden')}catch(e){}</script>

<!-- Alert overlay (son) -->
<div id="alertOv" class="hidden fixed inset-0 z-40 flex-col items-center justify-center p-5 text-center overflow-y-auto">
  <button id="resumeBar" class="hidden press mb-5 bg-black text-white font-bold text-xl rounded-2xl px-5 py-4 w-full max-w-md">🔊 Tap here to turn sound on</button>
  <div id="alertHead" class="text-4xl font-black mb-6 leading-tight"></div>
  <div id="alertBtns" class="flex flex-col gap-4 w-full max-w-md"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, goOnline, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCIfxOM0jddgDJLGvv-q4bu6xlSOsKSvYo",
  authDomain: "room-alert-34cd1.firebaseapp.com",
  databaseURL: "https://room-alert-34cd1-default-rtdb.firebaseio.com",
  projectId: "room-alert-34cd1",
  storageBucket: "room-alert-34cd1.firebasestorage.app",
  messagingSenderId: "428340494096",
  appId: "1:428340494096:web:745549aeb9cf83a2c46f95"
};
/* ============================================== */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const role = params.get("role") === "mother" ? "mother" : "son";
const RESPONSES = ["On my way!", "In washroom", "Coming in 5 mins", "Coming in 10 mins"];
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");
const LS = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
let muted = LS.get("soundMuted") === "true";   // Son's "vibrate only" switch (browsers cannot read the phone's ringer mode)

/* ---------- App icon (drawn on canvas: indigo tile + white bell) + inline PWA manifest ---------- */
function makeIcon(size) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, "#6366f1"); g.addColorStop(1, "#312e81");
  x.fillStyle = g; x.fillRect(0, 0, size, size);           // full-bleed (safe for maskable)
  x.scale(size / 512, size / 512);
  x.fillStyle = "#fff";
  x.fill(new Path2D("M256 96c-14 0-24 10-24 22v6c-52 12-88 58-88 112v72l-32 40v16h288v-16l-32-40v-72c0-54-36-100-88-112v-6c0-12-10-22-24-22z"));
  x.beginPath(); x.arc(256, 404, 32, 0, Math.PI * 2); x.fill();
  return c.toDataURL("image/png");
}
const ICON512 = makeIcon(512), ICON192 = makeIcon(192), ICON180 = makeIcon(180);
(() => {
  const add = (rel, href, extra = {}) => {
    const l = document.createElement("link"); l.rel = rel; l.href = href;
    Object.entries(extra).forEach(([k, v]) => l.setAttribute(k, v)); document.head.appendChild(l);
  };
  add("icon", ICON192, { type: "image/png" });
  add("apple-touch-icon", ICON180);
  const base = location.origin + location.pathname;
  const m = {
    id: base + "?app=room-alert", name: "Room Alert", short_name: "Room Alert",
    description: "In-house room call and emergency pager",
    start_url: base + "?role=" + role,           // installed icon opens on this phone's role
    scope: base.replace(/[^/]*$/, ""),
    display: "standalone", display_override: ["standalone"], orientation: "portrait",
    background_color: "#312e81", theme_color: "#312e81",
    icons: [
      { src: ICON192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: ICON512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: ICON512, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  add("manifest", URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" })));
})();

/* ---------- Role toggle ---------- */
const other = role === "mother" ? "son" : "mother";
$("roleToggle").textContent = `Role: ${role} (switch to ${other})`;
$("roleToggle").onclick = () => { params.set("role", other); location.search = params.toString(); };

/* ---------- Audio engine ---------- */
let ctx = null, master = null, chimeTimer = null, sirenOsc = null, sirenGain = null, sirenTimer = null, wakeLock = null;
const audioReady = () => !!ctx && ctx.state === "running";

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = 1.0;
    master.connect(comp); comp.connect(ctx.destination);
    ctx.onstatechange = () => { if (audioReady()) applyAudio(); };
  }
  if (ctx.state !== "running") ctx.resume().then(() => applyAudio()).catch(() => {});
  return ctx;
}
function bellTone(freq, start, dur, vol) {
  [[1, 1, "sine"], [2, 0.38, "sine"], [3, 0.16, "triangle"]].forEach(([mult, amp, type]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq * mult;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol * amp, start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(master);
    o.start(start); o.stop(start + dur + 0.05);
  });
}
function chimeOnce(t) {
  const C = 523.25, E = 659.25, G = 783.99;
  bellTone(C, t, 0.9, 0.55); bellTone(E, t + 0.20, 0.9, 0.55); bellTone(G, t + 0.40, 0.9, 0.55);
  [C, E, G, C * 2].forEach(f => bellTone(f, t + 0.65, 1.5, 0.5));
}
function chimeBurst() {
  if (!audioReady()) return;
  const t = ctx.currentTime + 0.02;
  chimeOnce(t); chimeOnce(t + 1.6); chimeOnce(t + 3.2);
}
function startChime() {
  stopSiren();
  if (chimeTimer || !audioReady()) return;
  chimeBurst();
  chimeTimer = setInterval(chimeBurst, 7500);
}
function stopChime() { clearInterval(chimeTimer); chimeTimer = null; }
function startSiren() {
  stopChime();
  if (sirenOsc || !audioReady()) return;
  sirenOsc = ctx.createOscillator(); sirenGain = ctx.createGain();
  sirenOsc.type = "square"; sirenGain.gain.value = 0.55; sirenOsc.frequency.value = 800;
  sirenOsc.connect(sirenGain).connect(master); sirenOsc.start();
  let hi = false;
  sirenTimer = setInterval(() => {
    hi = !hi; sirenOsc.frequency.setTargetAtTime(hi ? 1200 : 800, ctx.currentTime, 0.02);
  }, 400);
}
function stopSiren() {
  clearInterval(sirenTimer); sirenTimer = null;
  if (sirenOsc) { try { sirenOsc.stop(); } catch (e) {} sirenOsc.disconnect(); sirenOsc = null; }
}
function stopAllAudio() { stopChime(); stopSiren(); }
function showResume(on) { const b = $("resumeBar"); if (b) b.classList.toggle("hidden", !on); }

/* Start/stop audio to match the current alert. Safe to call any time. */
let vibTimer = null, vibKind = "";
function startVibLoop(st) {
  if (vibTimer && vibKind === st) return;
  stopVibLoop(); vibKind = st;
  const p = st === "emergency" ? [500, 200, 500, 200, 500] : [300, 150, 300];
  vibrate(p); vibTimer = setInterval(() => vibrate(p), 2500);
}
function stopVibLoop() { clearInterval(vibTimer); vibTimer = null; vibKind = ""; vibrate(0); }

function applyAudio() {
  if (role !== "son" || !lastState) return;
  const st = effective(lastState);
  if (st === "idle") { stopAllAudio(); stopVibLoop(); showResume(false); return; }
  startVibLoop(st);                                   // vibration always, screen flash is CSS
  if (muted) { stopAllAudio(); showResume(false); return; }   // vibrate-only mode: no Web Audio
  if (gateOpen()) return;
  if (!audioReady()) { ensureCtx(); showResume(true); return; }
  showResume(false);
  st === "calling" ? startChime() : startSiren();
}

async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}

/* ---------- Audio gate: shown only until first-ever tap ---------- */
const gateOpen = () => !$("audioGate").classList.contains("hidden");
const soundOn = () => LS.get("soundEnabled") === "true";
if (soundOn()) { $("audioGate").classList.add("hidden"); ensureCtx(); }

$("audioBtn").onclick = () => {
  LS.set("soundEnabled", "true");
  ensureCtx(); bellTone(659.25, ctx.currentTime, 0.8, 0.4);
  $("audioGate").classList.add("hidden");
  keepAwake(); askNotif(); applyAudio();
};
// Any touch anywhere resumes a suspended audio context (browser autoplay rule).
["pointerdown", "touchstart", "keydown", "click"].forEach(ev =>
  document.addEventListener(ev, () => { if (soundOn() && !audioReady()) ensureCtx(); }, { passive: true }));
$("resumeBar").onclick = () => ensureCtx();
const sm = $("soundMode");
function paintMode() {
  sm.textContent = muted ? "📳 Vibrate only" : "🔊 Sound on";
  sm.className = "text-sm font-bold rounded-full px-3 py-1 " + (muted ? "bg-amber-200 text-amber-900" : "bg-green-200 text-green-900");
}
if (role === "son") {
  paintMode();
  sm.onclick = () => { muted = !muted; LS.set("soundMuted", String(muted)); paintMode(); applyAudio(); };
}

/* ---------- Notifications ---------- */
let swReg = null, liveNotif = null, renotifyTimer = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(r => { swReg = r; }).catch(() => {});
}
function askNotif() {
  if (!("Notification" in window) || Notification.permission !== "default") return updateChip();
  try { Promise.resolve(Notification.requestPermission()).then(updateChip); } catch (e) { updateChip(); }
}
function updateChip() {
  let chip = $("notifChip");
  const need = "Notification" in window && Notification.permission === "default" && !gateOpen();
  const blocked = "Notification" in window && Notification.permission === "denied";
  if (!need && !blocked) { if (chip) chip.remove(); return; }
  if (!chip) {
    chip = document.createElement("button"); chip.id = "notifChip";
    chip.className = "press rounded-2xl px-4 py-3 text-base font-bold text-center";
    $("app").insertBefore(chip, $("view"));
  }
  if (need) {
    chip.className += " bg-indigo-600 text-white";
    chip.textContent = "🔔 Tap to allow notifications";
    chip.onclick = askNotif;
  } else {
    chip.className = "rounded-2xl px-4 py-3 text-sm font-semibold text-center bg-amber-100 text-amber-900";
    chip.textContent = "Notifications blocked. Allow them in browser or phone settings.";
    chip.onclick = null;
  }
}
function pushNotif(title, body, vib) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opts = { body, tag: "room-alert", renotify: true, requireInteraction: true,
    vibrate: vib, icon: ICON192, badge: ICON192 };
  if (swReg && swReg.showNotification) swReg.showNotification(title, opts).catch(() => {});
  else { try { liveNotif = new Notification(title, opts); liveNotif.onclick = () => { window.focus(); liveNotif.close(); }; } catch (e) {} }
}
function closeNotif() {
  try { liveNotif && liveNotif.close(); } catch (e) {}
  if (swReg && swReg.getNotifications) swReg.getNotifications({ tag: "room-alert" }).then(a => a.forEach(n => n.close())).catch(() => {});
}
function alertNotif(st) {
  const em = st === "emergency";
  pushNotif(em ? "🚨 EMERGENCY from Mom" : "🔔 Mom needs you",
    em ? "Emergency! Open the app and reply now." : "Mom needs you in her room.",
    em ? [500, 200, 500, 200, 500, 200, 500] : [300, 150, 300]);
}

/* ---------- Helpers ---------- */
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const fmt = ts => ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";

/* ---------- Firebase ---------- */
let db, stateRef, lastState = null, handledTs = 0, alertKey = "";
const idle = () => ({ status: "idle", mother_timestamp: 0, son_response: "Idle", response_timestamp: 0 });
/* Son's view of status: a call he already answered counts as idle, even if the write is still in flight. */
const effective = s => (s.status !== "idle" && handledTs && s.mother_timestamp === handledTs) ? "idle" : s.status;

function setConn(ok, msg) {
  $("dot").className = "w-3.5 h-3.5 rounded-full " + (ok ? "bg-green-500" : "bg-red-500");
  $("conn").textContent = msg;
}

if (!configured) {
  $("cfgWarn").classList.remove("hidden"); setConn(false, "Not configured"); buildView();
} else {
  try {
    db = getDatabase(initializeApp(firebaseConfig));
    stateRef = ref(db, "room_alert");
    onValue(ref(db, ".info/connected"), s =>
      s.val() ? setConn(true, role === "mother" ? "Connected to Home Network" : "Connected") : setConn(false, "Reconnecting…"));
    get(stateRef).then(s => { if (!s.exists()) set(stateRef, idle()); }).catch(e => setConn(false, "DB error: " + e.code));
    buildView();
    onValue(stateRef, s => { lastState = { ...idle(), ...(s.val() || {}) }; render(lastState); },
      e => setConn(false, "DB error: " + e.code));
  } catch (e) {
    setConn(false, "Config error"); $("cfgWarn").classList.remove("hidden"); buildView();
  }
}
updateChip();

function send(patch) {
  if (!stateRef) { alert("Firebase not configured."); return Promise.reject(); }
  return update(stateRef, patch);
}

/* ---------- Coming back to the app (unlock / tab switch) ---------- */
function onReturn() {
  if (document.hidden) return;
  keepAwake(); closeNotif();
  if (db) { try { goOnline(db); } catch (e) {} }
  if (soundOn()) ensureCtx();
  if (lastState) render(lastState);   // overlay + audio start instantly if an alert is active
}
document.addEventListener("visibilitychange", onReturn);
window.addEventListener("focus", onReturn);
window.addEventListener("pageshow", onReturn);

/* ---------- Views ---------- */
const TONES = {
  idle:  "bg-white border-slate-400 text-slate-900",
  call:  "bg-amber-200 border-amber-500 text-amber-950",
  emerg: "bg-red-200 border-red-600 text-red-950",
  reply: "bg-green-200 border-green-600 text-green-950"
};
function buildView() {
  const v = $("view");
  if (role === "mother") {
    v.innerHTML = `
      <div class="flex-1 flex flex-col justify-center">
        <div class="bell-wrap">
          <button id="callBtn" class="bell press" aria-label="Ring bell, call son">
            <span class="icon">🔔</span><span class="lbl">Need You</span>
          </button>
        </div>
        <button id="emBtn" class="em press w-full py-6 rounded-3xl text-white text-3xl font-black tracking-wide">🚨 EMERGENCY</button>
      </div>
      <div id="statusCard" aria-live="assertive"></div>`;
    const press = (btn, status, pat) => btn.onclick = () => {
      vibrate(pat);
      btn.classList.remove("hit"); void btn.offsetWidth; btn.classList.add("hit");
      setTimeout(() => btn.classList.remove("hit"), 750);
      send({ status, mother_timestamp: serverTimestamp(), son_response: "Idle", response_timestamp: 0 })
        .catch(e => alert("Send failed: " + (e && e.code || "check connection")));
    };
    press($("callBtn"), "calling", 80);
    press($("emBtn"), "emergency", [200, 100, 200, 100, 200]);
    renderStatus(TONES.idle, "", "Son is available", "");
  } else {
    v.innerHTML = `
      <div id="sonCard" class="flex-1 flex flex-col items-center justify-center rounded-3xl bg-green-100 border-4 border-green-500 text-green-900 p-8 text-center">
        <div class="text-7xl mb-4">🌿</div>
        <div class="text-3xl font-black">Monitoring alerts…</div>
        <div class="text-xl mt-1">Everything is quiet.</div>
        <div id="lastSent" class="mt-5 text-base font-semibold text-green-800"></div>
      </div>`;
    const g = $("alertBtns");
    g.innerHTML = RESPONSES.map(r => `<button data-r="${r}" class="reply press w-full px-4">${r}</button>`).join("");
    g.querySelectorAll("button").forEach(b => b.onclick = () => reply(b.dataset.r));
  }
}

/* Son taps a quick reply: silence + hide locally at once, then patch Firebase. */
function reply(text) {
  vibrate(50);
  stopAllAudio(); stopVibLoop(); closeNotif(); clearInterval(renotifyTimer);
  handledTs = (lastState && lastState.mother_timestamp) || 0;
  if (lastState) render(lastState);
  send({ status: "idle", son_response: text, response_timestamp: serverTimestamp() })
    .catch(e => {                       // write failed: bring the alert back so the reply can be retried
      handledTs = 0; alertKey = "";
      alert("Reply not sent (" + (e && e.code || "offline") + "). Try again.");
      if (lastState) render(lastState);
    });
}

function renderStatus(tone, small, big, time) {
  const c = $("statusCard");
  if (!c) return;
  c.className = "rounded-3xl border-4 p-6 text-center min-h-[11rem] flex flex-col items-center justify-center gap-2 shadow-lg " + tone;
  c.innerHTML = (small ? `<div class="text-2xl font-bold opacity-80">${small}</div>` : "") +
    `<div class="text-4xl font-black leading-tight">${big}</div>` +
    (time ? `<div class="text-3xl font-extrabold">${time}</div>` : "");
}

function render(s) {
  if (role === "mother") {
    if (s.status === "calling") renderStatus(TONES.call, "", "Calling… waiting for Son", "");
    else if (s.status === "emergency") renderStatus(TONES.emerg, "", "🚨 Emergency sent. Waiting for Son", "");
    else if (s.son_response && s.son_response !== "Idle") {
      renderStatus(TONES.reply, "Son responded:", s.son_response, fmt(s.response_timestamp));
      const c = $("statusCard"), k = s.son_response + ":" + s.response_timestamp;
      if (c.dataset.seen !== k) {
        c.dataset.seen = k; vibrate([100, 60, 100]);
        if (document.hidden) pushNotif("Son replied", s.son_response, [100, 60, 100]);
      }
    } else renderStatus(TONES.idle, "", "Son is available", "");
    return;
  }

  /* Son */
  const ov = $("alertOv"), head = $("alertHead"), last = $("lastSent");
  const st = effective(s);
  if (last) last.textContent = s.son_response !== "Idle" ? `Last reply: ${s.son_response} (${fmt(s.response_timestamp)})` : "";
  if (st === "idle") {
    ov.classList.add("hidden"); ov.classList.remove("flex", "amber", "red");
    stopAllAudio(); stopVibLoop(); showResume(false); clearInterval(renotifyTimer); alertKey = "";
    return;
  }
  ov.classList.remove("hidden"); ov.classList.add("flex");
  const em = st === "emergency";
  ov.classList.add(em ? "red" : "amber"); ov.classList.remove(em ? "amber" : "red");
  head.className = "text-4xl font-black mb-6 leading-tight " + (em ? "text-white drop-shadow" : "text-slate-900");
  head.textContent = em ? "🚨 EMERGENCY ALERT FROM MOM!" : "Mom needs you in her room!";

  const key = st + ":" + s.mother_timestamp;
  if (key !== alertKey) {                         // brand-new alert (or escalation)
    alertKey = key;
    clearInterval(renotifyTimer);
    if (document.hidden) alertNotif(st);
    renotifyTimer = setInterval(() => { if (document.hidden) alertNotif(st); }, 20000);
  }
  applyAudio();
}
</script>
</body>
</html>
