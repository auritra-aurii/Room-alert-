<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Room Alert</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  html,body{height:100%}
  body{-webkit-tap-highlight-color:transparent;user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  /* ---- Calling bell ---- */
  .bell-wrap{position:relative;width:min(74vw,17rem);aspect-ratio:1;margin:1.5rem auto}
  .bell-wrap::before,.bell-wrap::after{content:"";position:absolute;inset:0;border-radius:9999px;border:4px solid rgba(99,102,241,.55);animation:sonar 2.6s ease-out infinite;pointer-events:none}
  .bell-wrap::after{animation-delay:1.3s}
  @keyframes sonar{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
  .bell{position:relative;width:100%;height:100%;border-radius:9999px;border:0;cursor:pointer;
    background:radial-gradient(circle at 32% 24%,#c7d2fe 0%,#818cf8 22%,#4338ca 58%,#1e1b4b 100%);
    box-shadow:inset 0 -14px 26px rgba(0,0,0,.4),inset 0 10px 18px rgba(255,255,255,.4),0 0 0 8px #e0e7ff,0 0 0 12px #a5b4fc,0 24px 44px rgba(49,46,129,.55),0 0 60px rgba(99,102,241,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .08s,box-shadow .08s}
  .bell:active,.bell.hit{transform:scale(.94);box-shadow:inset 0 -6px 14px rgba(0,0,0,.45),inset 0 4px 10px rgba(255,255,255,.3),0 0 0 8px #e0e7ff,0 0 0 12px #a5b4fc,0 8px 18px rgba(49,46,129,.5),0 0 90px rgba(129,140,248,.8)}
  .bell .icon{font-size:6.5rem;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transform-origin:50% 10%}
  .bell.hit .icon{animation:swing .7s ease-in-out}
  @keyframes swing{0%,100%{transform:rotate(0)}15%{transform:rotate(22deg)}35%{transform:rotate(-18deg)}55%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
  .bell .lbl{font-size:1.9rem;font-weight:900;letter-spacing:.02em;text-shadow:0 2px 4px rgba(0,0,0,.4)}

  .em{background:linear-gradient(#ef4444,#b91c1c);box-shadow:0 8px 0 #7f1d1d,0 14px 24px rgba(127,29,29,.45);border:4px solid #fecaca}
  .em:active{transform:translateY(6px);box-shadow:0 2px 0 #7f1d1d}

  /* ---- Son overlay ---- */
  @keyframes amberbg{0%,100%{background-color:#fbbf24}50%{background-color:#f59e0b}}
  @keyframes redbg{0%,100%{background-color:#dc2626}50%{background-color:#450a0a}}
  .amber{animation:amberbg 1.4s ease-in-out infinite}
  .red{animation:redbg .6s steps(1) infinite}
  .press{transition:transform .08s}
  .press:active{transform:scale(.97)}
  .reply{min-height:5.25rem;font-size:1.75rem;font-weight:800;border-radius:1.5rem;background:#fff;color:#0f172a;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.25);border:3px solid rgba(0,0,0,.15)}
  .reply:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  @media (prefers-reduced-motion:reduce){.bell-wrap::before,.bell-wrap::after{animation:none}}
</style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

<div id="app" class="min-h-full max-w-md mx-auto flex flex-col p-4 gap-3">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span id="dot" class="w-3.5 h-3.5 rounded-full bg-slate-400"></span>
      <span id="conn" class="text-base font-medium text-slate-700">Connecting…</span>
    </div>
    <button id="roleToggle" class="text-xs text-slate-400 underline"></button>
  </header>

  <div id="cfgWarn" class="hidden bg-yellow-100 border border-yellow-400 text-yellow-900 rounded-xl p-3 text-sm">
    Firebase not configured. Edit <code>firebaseConfig</code> in the script block.
  </div>

  <main id="view" class="flex-1 flex flex-col gap-3"></main>
</div>

<!-- Audio unlock overlay -->
<div id="audioGate" class="fixed inset-0 z-50 bg-indigo-800 text-white flex flex-col items-center justify-center gap-6 p-8 text-center">
  <div class="text-7xl">🔔</div>
  <h1 class="text-4xl font-black">Room Alert</h1>
  <p class="text-indigo-100 text-lg">Tap once to turn on sound and alerts.</p>
  <button id="audioBtn" class="press bg-white text-indigo-800 font-black text-2xl rounded-full px-12 py-6 shadow-2xl">Enable Sound</button>
</div>

<!-- Alert overlay (son) -->
<div id="alertOv" class="hidden fixed inset-0 z-40 flex-col items-center justify-center p-5 text-center overflow-y-auto">
  <div id="alertHead" class="text-4xl font-black mb-6 leading-tight"></div>
  <div id="alertBtns" class="flex flex-col gap-4 w-full max-w-md"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, onDisconnect }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCIfxOM0jddgDJLGvv-q4bu6xlSOsKSvYo",
  authDomain: "room-alert-34cd1.firebaseapp.com",
  databaseURL: "https://room-alert-34cd1-default-rtdb.firebaseio.com",
  projectId: "room-alert-34cd1",
  storageBucket: "room-alert-34cd1.firebasestorage.app",
  messagingSenderId: "428340494096",
  appId: "1:428340494096:web:745549aeb9cf83a2c46f95"
};
/* ============================================== */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const role = params.get("role") === "mother" ? "mother" : "son";
const RESPONSES = ["On my way!", "In washroom", "Coming in 5 mins", "Coming in 10 mins"];
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

/* ---------- PWA manifest (inline) ---------- */
(() => {
  const icon = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#4f46e5"/><text x="256" y="340" font-size="280" text-anchor="middle">🔔</text></svg>');
  const m = { name: "Room Alert", short_name: "Room Alert", display: "standalone",
    background_color: "#312e81", theme_color: "#312e81", start_url: location.href,
    icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml" }] };
  const l = document.createElement("link");
  l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  document.head.appendChild(l);
})();

/* ---------- Role toggle ---------- */
const other = role === "mother" ? "son" : "mother";
$("roleToggle").textContent = `Role: ${role} (switch to ${other})`;
$("roleToggle").onclick = () => { params.set("role", other); location.search = params.toString(); };

/* ---------- Audio engine ---------- */
let ctx = null, master = null, chimeTimer = null, sirenOsc = null, sirenGain = null, sirenTimer = null, wakeLock = null;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    // master chain: gain -> compressor (keeps loud chords from clipping) -> speakers
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = 1.0;
    master.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

/* Bell-like note: fundamental + 2nd + 3rd harmonics, sharp attack, long decay */
function bellTone(freq, start, dur, vol) {
  [[1, 1, "sine"], [2, 0.38, "sine"], [3, 0.16, "triangle"]].forEach(([mult, amp, type]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq * mult;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol * amp, start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(master);
    o.start(start); o.stop(start + dur + 0.05);
  });
}

/* One triple-chime: C5 -> E5 -> G5 arpeggio, then full bright chord (root, major third, fifth, octave) */
function chimeOnce(t) {
  const C = 523.25, E = 659.25, G = 783.99;
  bellTone(C, t,        0.9, 0.55);
  bellTone(E, t + 0.20, 0.9, 0.55);
  bellTone(G, t + 0.40, 0.9, 0.55);
  [C, E, G, C * 2].forEach(f => bellTone(f, t + 0.65, 1.5, 0.5));
}
/* Burst: pattern repeated 3 times */
function chimeBurst() {
  if (!ctx) return;
  const t = ctx.currentTime + 0.02;
  chimeOnce(t); chimeOnce(t + 1.6); chimeOnce(t + 3.2);
}
function startChime() {
  stopSiren();
  if (chimeTimer) return;
  ensureCtx(); chimeBurst();
  chimeTimer = setInterval(chimeBurst, 7500); // burst ~5s + short pause, loops until acknowledged
}
function stopChime() { clearInterval(chimeTimer); chimeTimer = null; }

function startSiren() {
  stopChime();
  if (sirenOsc) return;
  ensureCtx();
  sirenOsc = ctx.createOscillator(); sirenGain = ctx.createGain();
  sirenOsc.type = "square"; sirenGain.gain.value = 0.55;
  sirenOsc.frequency.value = 800;
  sirenOsc.connect(sirenGain).connect(master);
  sirenOsc.start();
  let hi = false;
  sirenTimer = setInterval(() => {
    hi = !hi;
    sirenOsc.frequency.setTargetAtTime(hi ? 1200 : 800, ctx.currentTime, 0.02);
  }, 400);
}
function stopSiren() {
  clearInterval(sirenTimer); sirenTimer = null;
  if (sirenOsc) { try { sirenOsc.stop(); } catch (e) {} sirenOsc.disconnect(); sirenOsc = null; }
}
function stopAllAudio() { stopChime(); stopSiren(); }

async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

$("audioBtn").onclick = () => {
  ensureCtx(); bellTone(659.25, ctx.currentTime, 0.8, 0.4); // confirmation ding
  $("audioGate").classList.add("hidden");
  keepAwake();
  if (lastState) render(lastState); // start alarms if already active
};

/* ---------- Helpers ---------- */
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const fmt = ts => ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
const gateOpen = () => !$("audioGate").classList.contains("hidden");

/* ---------- Firebase ---------- */
let db, stateRef, lastState = null;
const idle = () => ({ status: "idle", mother_timestamp: 0, son_response: "Idle", response_timestamp: 0 });

function setConn(ok, msg) {
  $("dot").className = "w-3.5 h-3.5 rounded-full " + (ok ? "bg-green-500" : "bg-red-500");
  $("conn").textContent = msg;
}

if (!configured) {
  $("cfgWarn").classList.remove("hidden");
  setConn(false, "Not configured");
  buildView();
} else {
  try {
    db = getDatabase(initializeApp(firebaseConfig));
    stateRef = ref(db, "room_alert");
    onValue(ref(db, ".info/connected"), s =>
      s.val() ? setConn(true, role === "mother" ? "Connected to Home Network" : "Connected") : setConn(false, "Reconnecting…"));
    get(stateRef).then(s => { if (!s.exists()) set(stateRef, idle()); }).catch(e => setConn(false, "DB error: " + e.code));
    buildView();
    onValue(stateRef, s => { lastState = { ...idle(), ...(s.val() || {}) }; render(lastState); },
      e => setConn(false, "DB error: " + e.code));
  } catch (e) {
    setConn(false, "Config error"); $("cfgWarn").classList.remove("hidden"); buildView();
  }
}

function send(patch) {
  if (!stateRef) { alert("Firebase not configured."); return; }
  update(stateRef, patch).catch(e => alert("Send failed: " + e.code));
}

/* ---------- Views ---------- */
const TONES = {
  idle:  "bg-white border-slate-400 text-slate-900",
  call:  "bg-amber-200 border-amber-500 text-amber-950",
  emerg: "bg-red-200 border-red-600 text-red-950",
  reply: "bg-green-200 border-green-600 text-green-950"
};
function buildView() {
  const v = $("view");
  if (role === "mother") {
    v.innerHTML = `
      <div class="flex-1 flex flex-col justify-center">
        <div class="bell-wrap">
          <button id="callBtn" class="bell press" aria-label="Ring bell, call son">
            <span class="icon">🔔</span>
            <span class="lbl">Need You</span>
          </button>
        </div>
        <button id="emBtn" class="em press w-full py-6 rounded-3xl text-white text-3xl font-black tracking-wide">🚨 EMERGENCY</button>
      </div>
      <div id="statusCard" aria-live="assertive" class="rounded-3xl border-4 p-6 text-center min-h-[11rem] flex flex-col items-center justify-center gap-2 shadow-lg"></div>`;
    const press = (btn, status, pat) => btn.onclick = () => {
      vibrate(pat);
      btn.classList.remove("hit"); void btn.offsetWidth; btn.classList.add("hit");
      setTimeout(() => btn.classList.remove("hit"), 750);
      send({ status, mother_timestamp: Date.now(), son_response: "Idle", response_timestamp: 0 });
    };
    press($("callBtn"), "calling", 80);
    press($("emBtn"), "emergency", [200, 100, 200, 100, 200]);
    renderStatus(TONES.idle, "", "Son is available", "");
  } else {
    v.innerHTML = `
      <div id="sonCard" class="flex-1 flex flex-col items-center justify-center rounded-3xl bg-green-100 border-4 border-green-500 text-green-900 p-8 text-center">
        <div class="text-7xl mb-4">🌿</div>
        <div class="text-3xl font-black">Monitoring alerts…</div>
        <div class="text-xl mt-1">Everything is quiet.</div>
        <div id="lastSent" class="mt-5 text-base font-semibold text-green-800"></div>
      </div>`;
    const g = $("alertBtns");
    g.innerHTML = RESPONSES.map(r => `<button data-r="${r}" class="reply press w-full px-4">${r}</button>`).join("");
    g.querySelectorAll("button").forEach(b => b.onclick = () => {
      vibrate(50); stopAllAudio();
      send({ status: "idle", son_response: b.dataset.r, response_timestamp: Date.now() });
    });
  }
}

function renderStatus(tone, small, big, time) {
  const c = $("statusCard");
  if (!c) return;
  c.className = "rounded-3xl border-4 p-6 text-center min-h-[11rem] flex flex-col items-center justify-center gap-2 shadow-lg " + tone;
  c.innerHTML = (small ? `<div class="text-2xl font-bold opacity-80">${small}</div>` : "") +
    `<div class="text-4xl font-black leading-tight">${big}</div>` +
    (time ? `<div class="text-3xl font-extrabold">${time}</div>` : "");
}

function render(s) {
  if (role === "mother") {
    if (s.status === "calling") renderStatus(TONES.call, "", "Calling… waiting for Son", "");
    else if (s.status === "emergency") renderStatus(TONES.emerg, "", "🚨 Emergency sent. Waiting for Son", "");
    else if (s.son_response && s.son_response !== "Idle") {
      renderStatus(TONES.reply, "Son responded:", s.son_response, fmt(s.response_timestamp));
      const c = $("statusCard");
      if (c.dataset.seen !== String(s.response_timestamp)) { c.dataset.seen = s.response_timestamp; vibrate([100, 60, 100]); }
    } else renderStatus(TONES.idle, "", "Son is available", "");
    return;
  }
  // Son
  const ov = $("alertOv"), head = $("alertHead");
  const last = $("lastSent");
  if (last) last.textContent = s.son_response !== "Idle" ? `Last reply: ${s.son_response} (${fmt(s.response_timestamp)})` : "";
  if (s.status === "idle") {
    ov.classList.add("hidden"); ov.classList.remove("flex", "amber", "red");
    stopAllAudio(); return;
  }
  ov.classList.remove("hidden"); ov.classList.add("flex");
  if (s.status === "calling") {
    ov.classList.add("amber"); ov.classList.remove("red");
    head.className = "text-4xl font-black mb-6 leading-tight text-slate-900";
    head.textContent = "Mom needs you in her room!";
    if (!gateOpen()) startChime();
    vibrate([300, 150, 300]);
  } else {
    ov.classList.add("red"); ov.classList.remove("amber");
    head.className = "text-4xl font-black mb-6 leading-tight text-white drop-shadow";
    head.textContent = "🚨 EMERGENCY ALERT FROM MOM!";
    if (!gateOpen()) startSiren();
    vibrate([500, 200, 500, 200, 500]);
  }
}
</script>
</body>
</html>
